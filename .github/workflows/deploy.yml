name: Deploy Drava

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Copy env
        run: cp /var/www/drava/.env.local /home/runners/drava/_work/Krava/Krava/.env.local

      - name: Deploy
        run: |
          cp -r .next /var/www/drava/
          cp -r public /var/www/drava/
          cp package.json /var/www/drava/
          cp -r node_modules /var/www/drava/
          cd /var/www/drava
          pm2 restart drava || pm2 start npm --name drava -- start
          pm2 save
